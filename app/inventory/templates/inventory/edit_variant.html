{% extends "base.html" %}
{% block content %}
<style>
    .inv-page { padding:90px 24px 40px; max-width:700px; margin:auto; }
    .card { background:#fff; border-radius:14px; padding:28px; box-shadow:0 4px 16px rgba(0,0,0,.06); }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .full { grid-column:span 2; }
    label { display:block; font-size:12px; font-weight:600; color:#64748b; text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; }
    input { width:100%; padding:11px 14px; border:1px solid #e5e7eb; border-radius:8px; font-size:14px; outline:none; font-family:inherit; }
    input:focus { border-color:#22c55e; }
    .btn { padding:12px 24px; border-radius:8px; border:none; cursor:pointer; font-size:14px; font-weight:600; text-decoration:none; display:inline-block; }
    .btn-primary { background:#22c55e; color:#fff; }
    .btn-outline { background:#fff; border:1px solid #e5e7eb; color:#374151; }
    .checkbox-row { display:flex; align-items:center; gap:10px; }
    .checkbox-row input { width:auto; }
    .section-label { font-size:14px; font-weight:700; color:#0f172a; margin:20px 0 12px; border-bottom:1px solid #f1f5f9; padding-bottom:8px; }
</style>

<div class="inv-page">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <div>
            <h1 style="font-size:22px;font-weight:800;color:#0f172a;">Edit Variant — {{ variant.name }}</h1>
            <p style="font-size:13px;color:#64748b;">Product: {{ product.name }}</p>
        </div>
        <a href="{{ url_for('inventory.product_detail', id=product.id) }}" class="btn btn-outline">← Back</a>
    </div>

    <div class="card">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="section-label">Variant Details</div>
            <div class="form-grid">
                <div>
                    <label>Variant Name *</label>
                    <input type="text" name="name" value="{{ variant.name }}" required placeholder="e.g. 5kg">
                </div>
                <div>
                    <label>SKU (auto-generated)</label>
                    <input type="text" value="{{ variant.sku }}" disabled
                           style="background:#f8fafc;color:#94a3b8;">
                </div>
                <div>
                    <label>Selling Price (£) *</label>
                    <input type="number" name="price" step="0.01" min="0"
                           value="{{ variant.price }}" required>
                </div>
                <div>
                    <label>Cost Price (£)</label>
                    <input type="number" name="cost_price" step="0.01" min="0"
                           value="{{ variant.cost_price or '' }}">
                </div>
                <div>
                    <label>Low Stock Threshold</label>
                    <input type="number" name="low_stock_threshold" min="0"
                           value="{{ variant.low_stock_threshold or 10 }}">
                </div>
                <div style="display:flex;align-items:center;padding-top:24px;">
                    <label class="checkbox-row">
                        <input type="checkbox" name="is_active"
                               {% if variant.is_active %}checked{% endif %}>
                        Variant is active
                    </label>
                </div>
            </div>

            <div style="display:flex;gap:12px;margin-top:24px;">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="{{ url_for('inventory.product_detail', id=product.id) }}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
