{% extends "base.html" %}
{% block content %}
<style>
    .inv-page {
        padding: 90px 24px 40px;
        max-width: 900px;
        margin: auto;
    }

    .card {
        background: #fff;
        border-radius: 14px;
        padding: 28px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, .06);
        margin-bottom: 20px;
    }

    .card h2 {
        font-size: 18px;
        font-weight: 700;
        color: #0f172a;
        margin-bottom: 20px;
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
    }

    .full {
        grid-column: span 2;
    }

    label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: .06em;
        margin-bottom: 6px;
    }

    input,
    select,
    textarea {
        width: 100%;
        padding: 11px 14px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        font-size: 14px;
        outline: none;
        font-family: inherit;
    }

    input:focus,
    select:focus,
    textarea:focus {
        border-color: #22c55e;
        box-shadow: 0 0 0 3px rgba(34, 197, 94, .12);
    }

    .btn {
        padding: 12px 24px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        display: inline-block;
    }

    .btn-primary {
        background: #22c55e;
        color: #fff;
    }

    .btn-outline {
        background: #fff;
        border: 1px solid #e5e7eb;
        color: #374151;
    }

    .checkbox-row {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .checkbox-row input {
        width: auto;
    }

    .section-label {
        font-size: 14px;
        font-weight: 700;
        color: #0f172a;
        margin: 20px 0 12px;
        border-bottom: 1px solid #f1f5f9;
        padding-bottom: 8px;
    }
</style>

<div class="inv-page">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <h1 style="font-size:22px;font-weight:800;color:#0f172a;">+ Add Product to Inventory</h1>
        <a href="{{ url_for('inventory.products') }}" class="btn btn-outline">← Back</a>
    </div>

    <div class="card">
        <form method="POST" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="section-label">Basic Information</div>
            <div class="form-grid">
                <div class="full">
                    <label>Product Name *</label>
                    <input type="text" name="name" required placeholder="e.g. Island Sun Easy Cook Rice">
                </div>
                <div>
                    <label>Category *</label>
                    <select name="category_id" required>
                        <option value="">Select category</option>
                        {% for c in categories %}
                        <option value="{{ c.id }}">{{ c.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label>Supplier</label>
                    <select name="supplier_id">
                        <option value="">No supplier</option>
                        {% for s in suppliers %}
                        <option value="{{ s.id }}">{{ s.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label>Bin Location (optional)</label>
                    <select name="bin_location_id">
                        <option value="">No bin assigned</option>
                        {% for bin in bins %}
                        <option value="{{ bin.id }}">
                            {{ bin.name }}{% if bin.description %} — {{ bin.description }}{% endif %}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="full">
                    <label>Short Description</label>
                    <input type="text" name="short_description" placeholder="Brief summary">
                </div>
                <div class="full">
                    <label>Description *</label>
                    <textarea name="description" rows="4" placeholder="Full product description"></textarea>
                </div>
                <div>
                    <label>Brand</label>
                    <input type="text" name="brand" placeholder="Brand name">
                </div>
                <div>
                    <label>Product Image</label>
                    <input type="file" name="image" accept="image/*">
                </div>
            </div>

            <div class="section-label">Pricing & Stock</div>
            <div class="form-grid">
                <div>
                    <label>Selling Price (£) *</label>
                    <input type="number" name="price" step="0.01" min="0" required placeholder="0.00">
                </div>
                <div>
                    <label>Cost Price (£)</label>
                    <input type="number" name="cost_price" step="0.01" min="0" placeholder="0.00">
                </div>
                <div>
                    <label>Initial Stock Quantity</label>
                    <input type="number" name="stock_quantity" min="0" value="0">
                </div>
                <div>
                    <label>Low Stock Threshold</label>
                    <input type="number" name="low_stock_threshold" min="0" value="10">
                </div>
            </div>

            <div class="section-label">Options</div>
            <div class="form-grid">
                <div>
                    <label class="checkbox-row">
                        <input type="checkbox" name="has_variants">
                        This product has variants (e.g. different sizes/weights)
                    </label>
                    <p style="font-size:12px;color:#94a3b8;margin-top:6px;">You can add variants after saving the
                        product.</p>
                </div>
                <div>
                    <label class="checkbox-row">
                        <input type="checkbox" name="is_featured">
                        Feature this product on the homepage
                    </label>
                </div>
            </div>

            <div style="display:flex;gap:12px;margin-top:24px;">
                <button type="submit" class="btn btn-primary">Save Product</button>
                <a href="{{ url_for('inventory.products') }}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
