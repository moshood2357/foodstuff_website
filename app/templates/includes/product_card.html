<article class="product-card" role="listitem" aria-label="{{ product.name }}">

    <div class="product-card__img">

        <a href="{{ url_for('main.product_details', slug=product.slug) }}" style="color: #117843 !important; text-decoration: none;" tabindex="-1" aria-hidden="true">
            <img src="{{ url_for('static', filename='uploads/' + (product.image or 'default.png')) }}" 
                alt="{{ product.name }}" loading="eager" decoding="async" fetchpriority="high" width="400"
                height="300" />
        </a>

        {% if product.is_featured %}
        <span class="product-card__badge">Featured</span>
        {% endif %}

        <!-- ❤️ Wishlist -->
        <button type="button" class="product-card__wishlist add-to-wishlist-btn"
            aria-label="Add {{ product.name }} to wishlist" data-slug="{{ product.slug }}"
            data-csrf="{{ csrf_token() }}">
            <i class="fa-regular fa-heart"></i>
        </button>

    </div>

    <div class="product-card__body d-flex flex-column">

        <p class="product-card__cat">
            {{ product.category.name if product.category }}
        </p>

        <h3 class="product-card__name">
            <a href="{{ url_for('main.product_details', slug=product.slug) }}">
                {{ product.name }}
            </a>
        </h3>

        <p class="product-card__desc">
            {{ product.short_description or '' }}
        </p>

        <div class="mt-auto">

            <div class="product-card__footer mb-3">
                <p class="product-card__price">
                    £{{ product.price }}
                </p>
            </div>

            {% if product.id in cart_product_ids %}

            <a href="{{ url_for('cart.view_cart') }}" class="btn btn--primary w-100">
                View Cart
            </a>

            {% else %}

            <button type="button" class="btn btn--primary w-100 add-to-cart-btn" data-slug="{{ product.slug }}"
                data-csrf="{{ csrf_token() }}">
                Add to Cart
            </button>

            {% endif %}

        </div>

    </div>

</article>
