<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Judith Ethnic Store — POS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Arial', sans-serif;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* =========================
           LOADER SCREEN
        ========================= */
        .loader-screen {
            position: fixed;
            inset: 0;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            animation: fadeOut 0.8s ease 5.5s forwards;
        }

        @keyframes fadeOut {
            to { opacity: 0; pointer-events: none; }
        }

        /* LOGO SPIN */
        .loader-logo {
            width: 160px;
            height: 160px;
            margin-bottom: 36px;
            animation: spinSettle 2s cubic-bezier(0.8, 0.8, 0.75, 0.94) 0.4s both;
        }

        @keyframes spinSettle {
            0%   { transform: rotate(0deg) scale(0.5); opacity: 0; }
            40%  { transform: rotate(720deg) scale(1.1); opacity: 1; }
            60%  { transform: rotate(700deg) scale(0.95); }
            80%  { transform: rotate(715deg) scale(1.02); }
            100% { transform: rotate(720deg) scale(1); opacity: 1; }
        }

        /* POWERED BY — zigzag from right */
        .loader-powered {
            font-size: 16px;
            font-weight: 700;
            color: #38bdf8;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 10px;
            opacity: 0;
            animation: zigzagRight 1.8s ease 2.3s forwards;
        }

        @keyframes zigzagRight {
            0%   { transform: translateX(120px) translateY(0px);   opacity: 0; }
            20%  { transform: translateX(60px)  translateY(-12px);  opacity: 0.4; }
            40%  { transform: translateX(20px)  translateY(8px);   opacity: 0.7; }
            60%  { transform: translateX(-10px) translateY(-6px);  opacity: 0.9; }
            80%  { transform: translateX(5px)   translateY(3px);   opacity: 1; }
            100% { transform: translateX(0px)   translateY(0px);   opacity: 1; }
        }

        /* FOR JUDITH — smooth from left */
        .loader-for {
            font-size: 20px;
            font-weight: 800;
            color: #22c55e;
            letter-spacing: 0.04em;
            opacity: 0;
            animation: slideFromLeft 1.8s ease 3.6s forwards;
        }

        @keyframes slideFromLeft {
            0%   { transform: translateX(-140px); opacity: 0; }
            60%  { transform: translateX(10px);   opacity: 0.9; }
            80%  { transform: translateX(-5px);   opacity: 1; }
            100% { transform: translateX(0);      opacity: 1; }
        }

        /* PROGRESS BAR */
        .loader-bar-wrap {
            width: 200px;
            height: 3px;
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 32px;
            opacity: 0;
            animation: fadeIn 0.8s ease 2s forwards;
        }

        .loader-bar {
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, #22c55e, #38bdf8);
            border-radius: 10px;
            animation: fillBar 3s ease 2.1s forwards;
        }

        @keyframes fillBar {
            to { width: 100%; }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* =========================
           MAIN CONTENT
        ========================= */
        .main-content {
            opacity: 0;
            animation: fadeIn 0.6s ease 6s forwards;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 { font-size: 22px; font-weight: 800; color: #22c55e; }
        .logo p { font-size: 13px; color: #64748b; margin-top: 4px; }

        .staff-info {
            background: #0f172a;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .staff-avatar {
            width: 42px; height: 42px;
            border-radius: 50%;
            background: #22c55e;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 16px; color: #fff;
        }

        .staff-name { font-size: 15px; font-weight: 600; color: #f1f5f9; }
        .staff-role { font-size: 12px; color: #64748b; }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        input {
            width: 100%;
            padding: 14px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #f1f5f9;
            font-size: 16px;
            outline: none;
            margin-bottom: 24px;
        }

        input:focus { border-color: #22c55e; }

        .btn {
            width: 100%;
            padding: 15px;
            background: #22c55e;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn:hover { background: #16a34a; }

        .logout {
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            color: #64748b;
        }

        .logout a { color: #ef4444; text-decoration: none; }

        .footer-brand {
            text-align: center;
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .footer-brand span {
            font-size: 10px;
            color: #334155;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .footer-brand img {
            height: 24px;
            filter: brightness(0) invert(0.25);
        }
    </style>
</head>
<body>

    <!-- LOADER SCREEN -->
    <div class="loader-screen">

        <!-- SPINNING LOGO -->
        <img class="loader-logo"
             src="{{ url_for('static', filename='images/rokovo.jpg') }}"
             alt="R2 System Solution">

        <!-- POWERED BY — zigzag from right -->
        <div class="loader-powered">Powered by R2 System Solution Ltd</div>

        <!-- PROGRESS BAR -->
        <div class="loader-bar-wrap">
            <div class="loader-bar"></div>
        </div>

        <!-- FOR JUDITH — smooth from left -->
        <div class="loader-for">For Judith Ethnic Store</div>

        

    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <div class="card">

            <div class="logo">
                <h2 style ="color:white">ROKOVO(EPOS)</h2>
                <p>for</p>
                <h1>Judith Ethnic Store</h1>
            </div>

            <div class="staff-info">
                <div class="staff-avatar">{{ current_user.first_name[0] }}</div>
                <div>
                    <div class="staff-name">
                        {{ current_user.first_name }} {{ current_user.last_name }}
                    </div>
                    <div class="staff-role">{{ current_user.pos_role or 'Admin' }}</div>
                </div>
            </div>

            <form method="POST" action="{{ url_for('pos.open_session') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <label>Opening Float (£)</label>
                <input type="number" name="opening_float" step="0.01" min="0"
                    placeholder="0.00" value="0">
                <button type="submit" class="btn">🟢 Open Session & Start Selling</button>
            </form>

            <div class="logout">
                <a href="{{ url_for('auth.logout') }}">← Logout</a>
            </div>

            <div class="footer-brand">
                <h2>Powered by <span style = "color:#38bdf8">R2 System Solution Ltd</span></h2>
               
            </div>

        </div>
    </div>

</body>
</html>
