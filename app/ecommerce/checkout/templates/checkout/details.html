{% extends "base.html" %}

{% block title %}Checkout Details{% endblock %}

{% block content %}

<style>
    /* =========================
   PAGE LAYOUT
========================= */
    .checkout-page {
        padding-top: 110px;
        padding-bottom: 80px;
        background: #f6f7fb;
        min-height: 100vh;
        font-family: 'Inter', sans-serif;
    }

    .checkout-container {
        max-width: 1200px;
        margin: auto;
        display: grid;
        grid-template-columns: 1fr;
        gap: 25px;
    }

    /* =========================
   CARD
========================= */
    .card {
        background: #fff;
        border-radius: 16px;
        padding: 25px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
    }

    .card h2 {
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 18px;
        color: #0f172a;
    }

    /* =========================
   FORM
========================= */
    .input-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        position: relative;
    }

    .full {
        grid-column: span 2;
    }

    input,
    select {
        width: 100%;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid #e5e7eb;
        outline: none;
        font-size: 14px;
        transition: 0.2s;
        background: #fff;
    }

    input:focus,
    select:focus {
        border-color: #22c55e;
        box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15);
    }

    /* =========================
   BUTTONS
========================= */
    .btn-primary {
        width: 100%;
        margin-top: 18px;
        padding: 14px;
        background: #22c55e;
        color: #fff;
        font-weight: 700;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: 0.3s;
    }

    .btn-primary:hover {
        background: #16a34a;
    }

    .lookup-btn {
        padding: 12px;
        background: #0ea5e9;
        color: #fff;
        border: none;
        border-radius: 10px;
        cursor: pointer;
    }

    .lookup-btn:hover {
        background: #0284c7;
    }

    /* =========================
   ADDRESS DROPDOWN
========================= */
    .address-dropdown {
        margin-top: 6px;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        background: #fff;
        max-height: 220px;
        overflow-y: auto;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        grid-column: span 2;

        position: relative;
        z-index: 9999;
    }

    .address-dropdown.hidden {
        display: none;
    }

    .address-option {
        padding: 12px 14px;
        cursor: pointer;
        font-size: 14px;
        border-bottom: 1px solid #f1f5f9;
        transition: 0.2s;
    }

    .address-option:hover {
        background: #f0fdf4;
    }

    .address-loading,
    .address-error {
        padding: 12px 14px;
        font-size: 13px;
        color: #64748b;
    }

    .address-error {
        color: #ef4444;
    }

    /* =========================
   CHECKBOX
========================= */
    .custom-checkbox {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 15px;
        font-weight: 600;
        color: #0f172a;
        cursor: pointer;
        user-select: none;
        margin-top: 10px;
    }

    .custom-checkbox input {
        display: none;
    }

    .checkmark {
        width: 22px;
        height: 22px;
        border: 2px solid #94a3b8;
        border-radius: 6px;
        display: inline-block;
        position: relative;
        background: #fff;
    }

    .custom-checkbox input:checked+.checkmark {
        background: #22c55e;
        border-color: #22c55e;
    }

    .custom-checkbox input:checked+.checkmark::after {
        content: "";
        position: absolute;
        left: 6px;
        top: 2px;
        width: 6px;
        height: 12px;
        border: solid white;
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
    }

    .checkbox-text {
        display: flex;
        flex-direction: column;
    }

    .sub-text {
        font-size: 12px;
        color: #64748b;
    }

    /* =========================
   MOBILE
========================= */
    @media (max-width: 900px) {
        .checkout-container {
            grid-template-columns: 1fr;
        }
    }
</style>

<div class="checkout-page">
    <div class="checkout-container">

        <div class="card">

            <h2>Checkout Details</h2>

            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <!-- CONTACT -->
                <div class="section-title">Contact Information</div>

                <div class="input-grid">
                    <input name="full_name" placeholder="Full Name" required>
                    <input name="email" type="email" placeholder="Email" required>
                    <input name="phone" placeholder="Phone Number" class="full" required>
                </div>

                <!-- ADDRESS -->
                <div class="section-title">Delivery Address</div>

                <div class="input-grid">

                    <input id="postcode" name="postal_code" placeholder="Postcode">

                    <button type="button" class="lookup-btn" onclick="lookupAddress()">
                        Find Address
                    </button>

                    <div id="addressDropdown" class="address-dropdown hidden full"></div>

                    <input name="address_line_1" placeholder="Address Line 1" class="full">
                    <input name="address_line_2" placeholder="Address Line 2 (optional)" class="full">
                    <input name="city" placeholder="City">
                    <input name="state" placeholder="State / County">

                </div>

                <!-- BILLING -->
                <label class="custom-checkbox">
                    <input type="checkbox" id="sameAsDelivery" checked onchange="toggleBilling()">
                    <span class="checkmark"></span>

                    <div class="checkbox-text">
                        <span>Billing same as delivery</span>
                        <span class="sub-text" id="copyIndicator">Auto-copy enabled</span>
                    </div>
                </label>

                <div id="billingSection" style="display:none; margin-top:10px;">
                    <div class="section-title">Billing Address</div>

                    <div class="input-grid">
                        <input name="billing_address_line_1" placeholder="Address Line 1">
                        <input name="billing_address_line_2" placeholder="Address Line 2">
                        <input name="billing_city" placeholder="City">
                        <input name="billing_state" placeholder="State">
                        <input name="billing_postcode" placeholder="Postcode" class="full">
                    </div>
                </div>

                <!-- DELIVERY -->
                <div class="section-title">Delivery Method</div>

                <select name="delivery_method">
                    <option value="standard">Standard Delivery</option>
                    <option value="express">Express Delivery</option>
                </select>

                <button class="btn-primary" type="submit">
                    Continue to Summary
                </button>

            </form>

        </div>
    </div>
</div>

<script>
    /* =========================
       ADDRESS LOOKUP
    ========================= */
    async function lookupAddress() {
            const postcode = document.getElementById("postcode").value.trim();
            const dropdown = document.getElementById("addressDropdown");

            if (!postcode) return alert("Enter postcode");

            // ALWAYS show dropdown first
            dropdown.classList.remove("hidden");
            dropdown.innerHTML = `<div class="address-loading">Searching...</div>`;

            try {
                const res = await fetch(`/api/lookup-address?postcode=${postcode}`);
                const data = await res.json();

                if (!res.ok || !data.addresses) {
                    dropdown.innerHTML = `<div class="address-error">No addresses found</div>`;
                    return;
                }

                const addresses = data.addresses;

                if (addresses.length === 0) {
                    dropdown.innerHTML = `<div class="address-loading">No results found</div>`;
                    return;
                }

                dropdown.innerHTML = "";

                addresses.forEach(a => {
                    const div = document.createElement("div");
                    div.className = "address-option";

                    div.textContent = `${a.line_1}, ${a.post_town}`;

                    div.onclick = () => {
                        document.querySelector('[name="address_line_1"]').value = a.line_1;
                        document.querySelector('[name="address_line_2"]').value = a.line_2 || "";
                        document.querySelector('[name="city"]').value = a.post_town;
                        document.querySelector('[name="state"]').value = a.county;

                        dropdown.classList.add("hidden");

                        if (document.getElementById("sameAsDelivery").checked) {
                            copyBilling();
                        }
                    };

                    dropdown.appendChild(div);
                });

            } catch (e) {
                dropdown.innerHTML = `<div class="address-error">Error fetching address</div>`;
            }
        }
    /* =========================
       BILLING LOGIC
    ========================= */
    function toggleBilling() {
        const box = document.getElementById("sameAsDelivery");
        const section = document.getElementById("billingSection");

        section.style.display = box.checked ? "none" : "block";

        if (box.checked) copyBilling();
    }

    function copyBilling() {
        document.querySelector('[name="billing_address_line_1"]').value =
            document.querySelector('[name="address_line_1"]').value;

        document.querySelector('[name="billing_city"]').value =
            document.querySelector('[name="city"]').value;

        document.querySelector('[name="billing_state"]').value =
            document.querySelector('[name="state"]').value;

        document.querySelector('[name="billing_postcode"]').value =
            document.getElementById("postcode").value;
    }

    /* =========================
       CLOSE DROPDOWN
    ========================= */
    document.addEventListener("click", e => {
        const dropdown = document.getElementById("addressDropdown");

        if (!dropdown.contains(e.target) && e.target.id !== "postcode") {
            dropdown.classList.add("hidden");
        }
    });

    document.addEventListener("DOMContentLoaded", toggleBilling);
</script>

{% endblock %}
